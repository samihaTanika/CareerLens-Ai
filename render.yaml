services:
  - type: web
    name: careerlens-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && pip install PyMuPDF"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
