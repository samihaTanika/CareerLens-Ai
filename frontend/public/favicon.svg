<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="careerlens-title careerlens-desc">
  <title id="careerlens-title">CareerLens AI Logo Mark</title>
  <desc id="careerlens-desc">
    An optical lens ring opening toward a northeast AI neural spark, framing an ascending dual career trajectory chevron.
  </desc>

  <defs>
    <!-- Primary Optical Lens Gradient: Indigo -> Cyan -> Emerald -->
    <linearGradient id="cl-lens-grad" x1="12" y1="88" x2="88" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Ascending Trajectory Gradient: Emerald -> Cyan -> Indigo -->
    <linearGradient id="cl-chevron-grad" x1="50" y1="35" x2="50" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Neural Spark Gradient: High-Luminance Cyan -> Emerald -->
    <linearGradient id="cl-spark-grad" x1="65" y1="35" x2="88" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- 1. Inner NLP Data Calibration Ring (Subtle Optical Layer) -->
  <circle cx="50" cy="50" r="28" stroke="url(#cl-lens-grad)" stroke-width="1.75" stroke-dasharray="5 5" stroke-linecap="round" opacity="0.35" />

  <!-- 2. Outer Optical Lens Aperture (300-Degree Precision Arc) -->
  <path d="M 86.7 40.2 A 38 38 0 1 1 59.8 13.3" stroke="url(#cl-lens-grad)" stroke-width="8" stroke-linecap="round" />

  <!-- 3. Ascending Career Trajectory: Secondary Ranking Base Chevron -->
  <path d="M 38.5 68.5 L 50 57 L 61.5 68.5" stroke="url(#cl-chevron-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- 4. Ascending Career Trajectory: Primary Growth Vector -->
  <path d="M 30.5 56.5 L 50 37 L 69.5 56.5" stroke="url(#cl-chevron-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 5. AI Neural Spark (Focal Apex at 45-Degree Northeast Axis) -->
  <path d="M 76.5 11.5 Q 76.5 23.5 88.5 23.5 Q 76.5 23.5 76.5 35.5 Q 76.5 23.5 64.5 23.5 Q 76.5 23.5 76.5 11.5 Z" fill="url(#cl-spark-grad)" />

  <!-- 6. Focal Node (NLP Core Point) -->
  <circle cx="50" cy="24" r="2.25" fill="#22D3EE" />
</svg>
